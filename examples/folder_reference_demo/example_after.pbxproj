// Example: Folder reference approach (after folder references)
// For a Sources/ directory with 28 files
// This is what rules_xcodeproj generates AFTER the folder reference feature

// Single folder reference object (replaces 28 file references + 1 group)
		FE1234567890ABCDEF123456 /* Sources */ = {isa = PBXFileReference; lastKnownFileType = folder; path = Sources; sourceTree = "<group>"; };

// NOTE: Build phase entries still exist (generated by a different part of the system)
// The folder reference only affects the files_and_groups section
// Build files reference individual file paths from build file subidentifiers

// RESULT:
// files_and_groups section:
// - 1 folder reference object (1 * ~120 bytes = 120 bytes)
//
// BEFORE (files_and_groups section only):
// - 28 file reference objects (28 * ~140 bytes = 3,920 bytes)
// - 1 group object with 28 children (1 * ~1,400 bytes = 1,400 bytes)
// - Total: 5,320 bytes
//
// AFTER (files_and_groups section only):
// - 1 folder reference object (120 bytes)
// - Total: 120 bytes
//
// SAVINGS IN files_and_groups SECTION: 5,200 bytes (98% reduction)
//
// For a realistic example with 1,967 files (like the old bwb.xcodeproj):
// - Before: ~275 KB in files_and_groups section
// - After: ~10-15 KB in files_and_groups section
// - Savings: 95-96% reduction
